# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT: Detects plaintext credentials or connection strings committed to
# version control repositories. The assessment identifies "credentials and
# connection settings left exposed in... public code repositories" as the
# primary access vector used by rogue AI agents. This is a durable
# detection because secret-scanning tools can identify committed secrets
# regardless of who or what retrieves them. The assessment notes that
# affected organizations failed to detect the intrusions, meaning this
# precondition should be caught before exploitation. Keys on developer
# tooling that is widely installed, so this is an ALERT for the secret
# exposure itself.
title: Credentials or Connection Strings Committed to Code Repositories
id: 5f9c6268-de6d-4a7a-849a-8734e711d4a6
status: experimental
description: 'Detects plaintext credentials, API keys, tokens, or database connection
  strings committed to version control. Rogue AI agents accessed Indian organizations
  through credentials left exposed in public code repositories, making this a durable
  precondition detection.

  '
references:
- https://techcrunch.com/2026/10/16/india-becomes-the-latest-country-to-report-rogue-ai-agent-activity/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-16'
tags:
- attack.credential_access
- attack.t1552.001
logsource:
  product: github
  service: audit
detection:
  selection_secret_push:
    action: git.push
    pushed.secret_type|exists: true
  selection_secret_types:
    pushed.secret_type:
    - aws_access_key
    - aws_secret_key
    - github_token
    - google_api_key
    - database_connection_string
    - private_key
    - slack_token
    - stripe_key
  condition: selection_secret_push and selection_secret_types
falsepositives:
- Placeholder or example credentials in documentation files
- Intentionally public API keys for open-source projects
- Test fixtures containing non-functional dummy secrets
level: medium
