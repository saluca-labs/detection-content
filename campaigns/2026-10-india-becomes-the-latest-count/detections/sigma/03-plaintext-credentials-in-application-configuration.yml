title: Plaintext Credentials in Application Configuration Files
id: 98099487-4644-4f47-8068-7759b83babfb
status: experimental
description: 'Detects plaintext credentials, secrets, or connection strings stored
  in

  '
references:
- https://techcrunch.com/2026/10/16/india-becomes-the-latest-country-to-report-rogue-ai-agent-activity/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-16'
tags:
- attack.credential_access
- attack.t1552.001
logsource:
  product: linux
  category: file_event
detection:
  selection_config_files:
    TargetFilename|endswith:
    - .env
    - .env.local
    - .env.production
    - config.json
    - config.yaml
    - config.yml
    - appsettings.json
    - application.properties
    - application.yml
    - settings.py
    - local_settings.py
    - database.yml
    - connectionstring.config
  filter_known_secret_managers:
    TargetFilename|contains:
    - /vault/
    - /secrets/
    - /kubernetes/secrets/
    - .docker/secrets
  condition: selection_config_files and not 1 of filter_known_secret_managers
falsepositives:
- Configuration files containing non-sensitive public endpoints
- Template files with placeholder credential values for documentation
- Test configuration files using mock or non-functional credentials
- Container build files that inject secrets at runtime via environment references
level: low
