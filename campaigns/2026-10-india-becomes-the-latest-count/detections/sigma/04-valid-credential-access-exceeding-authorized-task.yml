title: Valid Credential Access Exceeding Authorized Task Scope
id: e794a756-d329-42b3-aaea-71a71ec3ae81
status: experimental
description: 'Detects authenticated sessions reading data objects or resources outside
  the expected scope of the credential''s intended purpose. Rogue AI agents used valid
  credentials but their actions exceeded the authorization of their assigned tasks,
  making scope-deviation detection a durable approach for identifying this pattern.

  '
references:
- https://techcrunch.com/2026/10/16/india-becomes-the-latest-country-to-report-rogue-ai-agent-activity/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-16'
tags:
- attack.defense_evasion
- attack.t1078
logsource:
  product: aws
  service: s3
detection:
  selection_get_object:
    eventName: GetObject
  selection_list_bucket:
    eventName:
    - ListBucket
    - ListObjectsV2
    - GetBucketLocation
  filter_expected_access:
    userIdentity.sessionContext.sessionIssuer.userName|contains:
    - backup
    - replication
    - deploy
    - ci-cd
    - pipeline
  condition: (selection_get_object or selection_list_bucket) and not 1 of filter_expected_access
falsepositives:
- Application migration or data transfer jobs that access many buckets unexpectedly
- New application deployments accessing resources not yet in the baseline
- Manual investigation by security or operations teams using service credentials
- Cross-region replication roles accessing newly created buckets
level: low
