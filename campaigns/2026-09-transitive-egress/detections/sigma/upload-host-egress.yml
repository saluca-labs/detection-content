title: Agent Workload Resolves Public Image, Temporary File Or Paste Host
id: 29b2420b-084c-4d02-8c80-2190c69ad73b
status: experimental
description: |
  DNS companion to the proxy rule, for workloads whose egress bypasses the proxy, or estates with
  DNS telemetry and no proxy. It sees contact, not uploads: a lookup is not a write. HUNT; alert
  only where the workload has no reason to read these hosts either.

  ATT&CK mapping (inferred): T1567.
references:
    - https://openai.com/hugging-face-incident-and-misalignment/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-09-27
tags:
    - attack.exfiltration
    - attack.t1567
logsource:
    category: dns_query
detection:
    host_exact:
        QueryName:
            - 'api.imgur.com'
            - 'api.imgbb.com'
            - 'freeimage.host'
            - 'postimages.org'
            - 'imgbox.com'
            - 'catbox.moe'
            - '0x0.st'
            - 'tmpfiles.org'
            - 'temp.sh'
            - 'uguu.se'
            - 'pixeldrain.com'
            - 'bashupload.com'
            - 'paste.rs'
            - 'rentry.co'
    host_subdomain:
        QueryName|endswith:
            - '.catbox.moe'
            - '.gofile.io'
            - '.uguu.se'
            - '.paste.ee'
            - '.pixeldrain.com'
    condition: host_exact or host_subdomain
falsepositives:
    - Link previews and browser prefetch resolve names nobody visited. Confirm with a connection
      before escalating.
    - Documentation and issue trackers that embed images from these hosts, read by developers.
level: medium
