# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT rule: detects installation or update of Brotli-related packages so
# defenders can track patch status of dependencies mentioned in the source
# (Node.js, Bun, Python brotli/brotlicffi, Ruby components). This is
# configuration management, not behavioral detection. Level is low because
# package installation is routine and this rule keys on legitimate,
# widely-installed software.
title: Brotli Package Installation or Update
id: 07bf0721-f359-4265-b607-58bb274795aa
status: experimental
description: 'Hunts for package manager activity involving Brotli-related packages
  across npm, pip, and gem to help defenders track whether Brotli-dependent runtimes
  have been patched after the disclosure of a memory-safety flaw.

  '
references:
- https://www.tokenpost.com/news/technology/40412
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-30'
tags: []
logsource:
  product: linux
  category: process_creation
detection:
  selection_npm:
    Image|endswith:
    - /npm
    - /yarn
    - /pnpm
    CommandLine|contains:
    - brotli
  selection_pip:
    Image|endswith:
    - /pip
    - /pip3
    - /python
    CommandLine|contains:
    - brotli
    - brotlicffi
  selection_gem:
    Image|endswith:
    - /gem
    - /bundle
    CommandLine|contains:
    - brotli
  condition: selection_npm or selection_pip or selection_gem
falsepositives:
- Routine dependency updates in CI/CD pipelines
- Developer installing Brotli packages for legitimate compression needs
- Container image builds that include Brotli libraries
- Automated patch management tools updating system packages
level: low
