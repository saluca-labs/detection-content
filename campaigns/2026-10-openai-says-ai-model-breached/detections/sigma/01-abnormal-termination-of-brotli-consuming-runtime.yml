# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT rule: detects abnormal termination (segfault) in runtimes that
# consume Brotli-compressed data. The assessment notes the out-of-bounds
# write can manifest as a crash before or instead of code execution, making
# this a side-effect hunt rather than a reliable exploitation detection.
# Level is low because these runtimes are widely installed and crash for
# many benign reasons (OOM, bad input, native addon bugs). No ATT&CK tag
# is applied since T1499 is a stretch per the assessment.
title: Abnormal Termination of Brotli-Consuming Runtime
id: c47673b2-a7d5-494a-b0b2-0a40b6de89c1
status: experimental
description: 'Hunts for segfaults or abnormal exits in Node.js, Bun, Python, or Ruby
  processes that may indicate a Brotli decoder out-of-bounds write triggered by malformed
  compressed input. This is a side effect of the bug, not a reliable indicator of
  exploitation.

  '
references:
- https://www.tokenpost.com/news/technology/40412
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-30'
tags: []
logsource:
  product: linux
  service: syslog
detection:
  selection_segfault:
    message|contains:
    - segfault
    - SIGSEGV
  selection_runtime:
    message|contains:
    - node
    - bun
    - python
    - ruby
  filter_brotli_context:
    message|contains:
    - brotli
    - Brotli
  condition: selection_segfault and selection_runtime
falsepositives:
- Benign malformed compressed input causing a decoder crash
- Native addon bugs unrelated to Brotli
- Out-of-memory conditions triggering SIGSEGV
- General application bugs in Node.js, Bun, Python, or Ruby
level: low
