# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT: Detects rapid iterative webshell deployment via MySQL general_log
# poisoning, a specific technique used by ARTEX to achieve code execution.
# The pattern of SET GLOBAL general_log_file, enabling general_log, then
# SELECT with webshell content produces multiple ephemeral webshell files.
# Durable because the log poisoning mechanism requires these specific SQL
# statements in sequence. Keys on MySQL query logs for the poisoning pattern.
title: ARTEX Rapid Webshell Deployment via MySQL General Log Poisoning
id: 946e2cff-e92e-488f-bdc3-90da32ffd0de
status: experimental
description: 'Detects sequential MySQL statements that poison the general log to deploy
  webshells, including SET GLOBAL general_log_file, SET GLOBAL general_log = 1, and
  SELECT statements containing JSP or ASP webshell content, as observed in ARTEX framework
  intrusions.

  '
references:
- https://cloud.google.com/blog/topics/threat-intelligence/artex-and-friends-enter-agentic-offensive-frameworks/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-11-01'
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: linux
  service: mysql
detection:
  selection_log_file:
    Message|contains|all:
    - SET GLOBAL general_log_file
    - .jsp
  selection_log_enable:
    Message|contains: SET GLOBAL general_log = 1
  selection_webshell_content:
    Message|contains|all:
    - SELECT
    - <%
    - '%>'
  condition: selection_log_file or (selection_log_enable and selection_webshell_content)
falsepositives:
- Database administrator testing general log functionality with webshell-like test
  strings
- Application integration tests that write JSP snippets to MySQL logs
level: high
