title: Agent Session Reasons About Reprioritising Attack Paths
id: 3d9c1b47-2e58-4f0a-8b6c-1a7d5e9f2c34
status: experimental
description: |
  Planner-shaped reasoning about intrusion. The Taiwan tool "continuously ranked and
  reprioritised possible attack paths based on available evidence" and, when blocked, went
  looking for a new approach.

  This targets the planning behaviour rather than any single action, which is what makes an
  agent campaign different from a scanner. Observable only at a gateway that logs completions
  as well as prompts.

  Expect fewer hits than the authorization rule but far higher fidelity when it fires.
references:
    - https://securityaffairs.com/197079/apt/china-linked-hackers-use-ai-agents-in-autonomous-attack-on-taiwan.html
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-20
tags:
    - atlas.aml-t0051
    - attack.discovery
    - attack.lateral-movement
logsource:
    product: llm_gateway
    category: completion
detection:
    planning_language:
        completion|contains:
            - 'next attack path'
            - 'alternative attack vector'
            - 'that approach failed, try'
            - 'reprioriti'
            - 'highest value target'
            - 'pivot to'
    intrusion_context:
        completion|contains:
            - 'domain controller'
            - 'credential'
            - 'privilege'
            - 'foothold'
            - 'lateral'
            - 'exfiltrat'
    condition: planning_language and intrusion_context
falsepositives:
    - Purple team exercises and detection engineering work. Notably, writing THIS repository
      would trigger it.
    - Threat intelligence summarisation.
level: medium
