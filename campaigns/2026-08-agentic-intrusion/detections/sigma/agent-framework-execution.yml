title: MCP Tool Server Spawned By Package Runner
id: c7c4427c-0598-4127-a12c-65b1855233f4
status: experimental
description: |
  A package runner (uvx, npx, pipx) launching a Model Context Protocol server. MCP servers
  are how an agent acquires the ability to touch something real: a filesystem, a database, a
  browser, a cloud API. An agent with no tools is a chatbot; an agent with MCP servers is an
  actor.

  On a server-class host, this is the moment an LLM gained hands. That is worth knowing
  regardless of whether anything malicious follows.
references:
    - https://securityaffairs.com/197079/apt/china-linked-hackers-use-ai-agents-in-autonomous-attack-on-taiwan.html
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-20
tags:
    - attack.execution
    - attack.t1059
    - attack.persistence
logsource:
    category: process_creation
    product: windows
detection:
    runner:
        Image|endswith:
            - '\uvx.exe'
            - '\uv.exe'
            - '\npx.cmd'
            - '\npx.exe'
            - '\pipx.exe'
    mcp_indicator:
        CommandLine|contains:
            - 'mcp'
            - 'model-context-protocol'
            - '--stdio'
    # Tool servers that reach outside the host are the ones that matter.
    reaching_tools:
        CommandLine|contains:
            - 'filesystem'
            - 'postgres'
            - 'mysql'
            - 'sqlite'
            - 'ssh'
            - 'kubernetes'
            - 'aws'
            - 'azure'
            - 'gcloud'
            - 'shell'
            - 'exec'
            - 'browser'
            - 'puppeteer'
            - 'playwright'
    condition: runner and mcp_indicator and reaching_tools
falsepositives:
    - Developer environments, constantly. This is a hunting rule for server estates.
    - CI runners that legitimately use MCP tooling in a pipeline.
level: informational
