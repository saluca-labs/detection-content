# Sigma - agent framework and MCP tool-server artefacts on hosts.
#
# The Taiwan toolkit was 1,395 files built around Hermes (NousResearch) and OpenClaw, both
# freely downloadable. Those frameworks are LEGITIMATE and widely installed, including in
# our own estate, so nothing here is evidence of an intrusion by itself.
#
# THESE ARE HUNTING RULES, NOT ALERTS. What they answer is "where in my estate can an LLM
# take actions", which is a question most organisations cannot currently answer at all. The
# finding that matters is an agent framework on a host where no developer works.
#
# Ref: https://securityaffairs.com/197079/apt/china-linked-hackers-use-ai-agents-in-autonomous-attack-on-taiwan.html
# Author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team, 2026-08-20

title: LLM Agent Framework Executed On Non-Developer Host
id: 517b530d-8d30-4346-b792-814d844df40f
status: experimental
description: |
  Execution of an open-source LLM agent framework. Hermes and OpenClaw were the two used in
  the July 2026 Taiwan campaign; the others are included because the technique is
  framework-agnostic and an operator will simply pick a different one.

  Scope this to hosts where a developer toolchain has no business existing. On an engineer's
  laptop this is noise. On a file server it is the whole investigation.
references:
    - https://securityaffairs.com/197079/apt/china-linked-hackers-use-ai-agents-in-autonomous-attack-on-taiwan.html
    - https://github.com/NousResearch/hermes-agent
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-20
tags:
    - attack.execution
    - attack.t1059.006
    - attack.discovery
logsource:
    category: process_creation
    product: windows
detection:
    framework_binary:
        - Image|endswith:
            - '\hermes.exe'
            - '\openclaw.exe'
        - CommandLine|contains:
            - 'hermes-agent'
            - 'openclaw'
            - '-m hermes'
            - 'nousresearch/hermes'
    framework_paths:
        CommandLine|contains:
            - '\AppData\Local\hermes\'
            - '\.hermes\'
            - '\.openclaw\'
            - '/.hermes/'
            - '/.openclaw/'
    condition: framework_binary or framework_paths
falsepositives:
    - Developer workstations. Expected and normal. Scope by host role rather than trying to
      enumerate exceptions.
    - Our own estate runs a Hermes fork. Any deployment of this rule inside Saluca must
      allowlist the known install paths first.
level: informational
