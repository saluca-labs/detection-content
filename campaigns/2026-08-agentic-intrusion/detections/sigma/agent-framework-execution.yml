title: Large Multi-File Toolkit Unpacked Into User-Writable Path
id: 1f5a0e2c-6b3d-4a9e-9c71-3b2d8f4e7a10
status: experimental
description: |
  The Taiwan toolkit was 1,395 files in a 160 MB archive. Mass extraction of a large archive
  into a user-writable location, followed shortly by interpreter execution from that same
  path, is a generic staging pattern that this campaign happens to exemplify.

  Deliberately generic. It will catch legitimate software installs too, and it is here for
  retrospective hunting around a suspected window rather than for standing alerting.
references:
    - https://securityaffairs.com/197079/apt/china-linked-hackers-use-ai-agents-in-autonomous-attack-on-taiwan.html
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-20
tags:
    - attack.execution
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    extraction:
        Image|endswith:
            - '\tar.exe'
            - '\7z.exe'
            - '\unzip.exe'
        CommandLine|contains:
            - '-x'
            - 'e '
            - 'x '
    staging_path:
        CommandLine|contains:
            - '\AppData\Local\Temp\'
            - '\ProgramData\'
            - '\Users\Public\'
    condition: extraction and staging_path
falsepositives:
    - Software installation, updaters, and any developer workflow. High volume by design.
      Use this to narrow a known window, not as an alert.
level: informational
