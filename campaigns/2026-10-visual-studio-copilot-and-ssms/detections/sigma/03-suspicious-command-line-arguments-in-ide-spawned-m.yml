# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT: Detects child processes of Visual Studio or SSMS with suspicious command-line
# patterns that may indicate a malicious MCP server entry was added to .mcp.json. The
# source describes that a malicious command added as an MCP server in .mcp.json is
# launched by the IDE. This is a HUNT because MCP server launches are legitimate IDE
# functionality; the detection keys on command-line content patterns commonly associated
# with payload delivery rather than on the launch itself.
title: Suspicious Command-Line Arguments in IDE-Spawned MCP Server Processes
id: 96e554c3-bc1e-4392-bf1b-15d4a37f1487
status: experimental
description: 'Hunts for child processes of Visual Studio or SSMS whose command-line
  arguments contain patterns consistent with payload execution rather than normal
  MCP server or tool invocation. In CVE-2026-103572, an attacker can add a malicious
  command as an MCP server entry in .mcp.json, which the IDE then launches.

  '
references:
- https://embracethered.com/blog/posts/2026/visual-studio-copilot-remote-code-execution/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1218
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \devenv.exe
    - \Ssms.exe
    - \ssms.exe
  selection_suspicious_cli:
    CommandLine|contains:
    - powershell
    - cmd.exe /c
    - cmd.exe /k
    - 'curl '
    - 'wget '
    - Invoke-
    - IEX
    - DownloadString
    - Start-Process
    - rundll32
    - regsvr32
    - mshta
    - certutil
    - bitsadmin
  condition: selection_parent and selection_suspicious_cli
falsepositives:
- Legitimate MCP servers that accept URL or script arguments resembling download commands
- Development or debugging workflows that invoke PowerShell or cmd from IDE tasks
- Build scripts or task runners configured through IDE project settings
level: low
