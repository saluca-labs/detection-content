# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT: Detects file reads of SSMS.isolation.ini by the Visual Studio or SSMS process
# outside expected startup windows. The source states that reading SSMS.isolation.ini
# discloses the InstallationID, which is used to construct the path to the user settings
# file. An unexpected read of this file by the Copilot agent is a consequence of the
# path traversal bypass when the attacker needs to locate the target settings file.
# This is a HUNT because the IDE may legitimately read this file during normal
# operations; the detection is most useful when correlated with configuration file
# writes or anomalous process launches.
title: SSMS Isolation INI File Read by IDE Process
id: a4f8baf6-3264-4251-9d33-cd82cebac340
status: experimental
description: 'Hunts for reads of SSMS.isolation.ini by the Visual Studio or SSMS process.
  In CVE-2026-103572, an attacker leveraging the path traversal bypass may read this
  file to obtain the InstallationID needed to construct the path to the user settings
  file. This observable is most durable when correlated with subsequent writes to
  protected configuration files.

  '
references:
- https://embracethered.com/blog/posts/2026/visual-studio-copilot-remote-code-execution/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1082
- attack.discovery
logsource:
  product: windows
  category: file_access
detection:
  selection_target:
    TargetFilename|endswith:
    - \SSMS.isolation.ini
  selection_process:
    Image|endswith:
    - \devenv.exe
    - \Ssms.exe
    - \ssms.exe
  condition: selection_target and selection_process
falsepositives:
- Normal SSMS startup reads of isolation settings during application launch
- IDE diagnostics or telemetry components reading installation metadata
- Extension or plugin initialization that queries SSMS installation configuration
level: low
