# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT: Detects file writes to protected Copilot configuration files by the Visual Studio
# or SSMS process. This is the primary observable consequence of CVE-2026-103572, where
# the Copilot agent bypasses path validation (via trailing dot or path traversal) to write
# to .mcp.json or settings.VisualStudio.json. EDR will record the canonical filename
# (Windows strips trailing dots), so we key on the canonical names. Scoped to the IDE
# processes to reduce noise from other editors or tooling.
title: Visual Studio Copilot Configuration File Modification by IDE Process
id: f06ef85c-ca9f-45cc-a783-3423d73235c9
status: experimental
description: 'Detects writes to .mcp.json or settings.VisualStudio.json by the Visual
  Studio or SSMS process. These files are protected configuration targets in CVE-2026-103572,
  where a path validation bypass allows the Copilot agent to modify settings it was
  explicitly restricted from changing, enabling arbitrary command execution.

  '
references:
- https://embracethered.com/blog/posts/2026/visual-studio-copilot-remote-code-execution/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1574
- attack.persistence
- attack.defense_evasion
logsource:
  product: windows
  category: file_event
detection:
  selection_target:
    TargetFilename|endswith:
    - \.mcp.json
    - \settings.VisualStudio.json
  selection_process:
    Image|endswith:
    - \devenv.exe
    - \Ssms.exe
    - \ssms.exe
  condition: selection_target and selection_process
falsepositives:
- Legitimate user-initiated changes to Copilot or MCP server configuration through
  the IDE UI
- IDE extension or plugin updates that modify MCP configuration files
- Enterprise deployment tools pushing configuration changes through the IDE process
level: high
