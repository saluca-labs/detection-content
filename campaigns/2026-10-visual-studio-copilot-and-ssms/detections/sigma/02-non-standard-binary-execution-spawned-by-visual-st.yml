# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT: Detects child processes spawned by Visual Studio or SSMS from non-standard binary
# paths, which may indicate exploitation of the ripgrepPath setting override described in
# CVE-2026-103572. The source states that overwriting copilot.general.tools.ripgrepPath
# with an arbitrary path causes that binary to launch when Copilot performs a search.
# This is a HUNT because the IDE legitimately spawns many child processes and ripgrep
# is a standard search tool; the detection keys on the IDE parent process combined with
# child process image paths that are outside typical IDE tool directories.
title: Non-Standard Binary Execution Spawned by Visual Studio or SSMS
id: cb561eca-94cf-4c07-beb9-a12994482a41
status: experimental
description: 'Hunts for child processes of Visual Studio or SSMS whose image path
  does not match known legitimate IDE tool locations. In CVE-2026-103572, an attacker
  who modifies the copilot.general.tools.ripgrepPath setting can cause an arbitrary
  binary to execute when Copilot invokes a search, achieving code execution through
  a hijacked configuration value.

  '
references:
- https://embracethered.com/blog/posts/2026/visual-studio-copilot-remote-code-execution/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1574.007
- attack.t1574
- attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - \devenv.exe
    - \Ssms.exe
    - \ssms.exe
  filter_standard_locations:
    Image|startswith:
    - C:\Program Files\
    - C:\Program Files (x86)\
    - C:\Windows\System32\
    - C:\Windows\SysWOW64\
    - C:\Users\
  condition: selection_parent and not filter_standard_locations
falsepositives:
- Custom development tools or scripts installed in non-standard directories invoked
  by the IDE
- Third-party extensions or plugins that spawn helper binaries from user profile paths
- Portable executables run from project directories during debugging or testing
level: low
