# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Detection opportunity 2: Direct API calls using tokens extracted from
# frontend configuration files. This is a HUNT rule because the observable,
# a client making direct API calls without a preceding browser navigation
# pattern, is a behavioral signal that requires context to evaluate. The
# durable aspect is the sequence: a request for a settings or config file
# followed immediately by API calls using credentials found in that file,
# without the normal page-load and interaction telemetry that a browser
# session produces. ATT&CK T1552.001 and T1078 apply. Level: low because
# direct API calls are common in legitimate automation.
title: Direct API Calls Using Tokens Extracted from Frontend Configuration
id: 21b58f4d-d73a-413c-9e78-f0ae07ba1145
status: experimental
description: 'Detects a client requesting a frontend settings or configuration file
  and then making direct API calls using tokens found in that file, without a preceding
  browser navigation pattern. In the context of unintended LLM agent actions, a model
  may read a configuration file to extract API tokens and then use them to bypass
  UI-level click restrictions. The observable is durable because the sequence of config-file
  access followed by token-bearing API calls is a distinct behavioral pattern that
  differs from normal browser sessions.

  '
references:
- https://www.anthropic.com/research/investigating-unintended-model-actions
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1552.001
- attack.t1078
logsource:
  product: webserver
  service: iis
detection:
  selection_config_access:
    cs-uri-stem|endswith:
    - /settings.js
    - /config.js
    - /settings.json
    - /config.json
    - /app.config.js
    - /env.js
  selection_api_call:
    cs-uri-stem|contains:
    - /api/
    - /graphql
    - /rest/
    - /v1/
    - /v2/
  selection_auth_header:
    Authorization|contains:
    - Bearer
    - Token
    - api-key
  filter_browser_navigation:
    cs-user-agent|contains:
    - Mozilla
    - Chrome
    - Safari
    - Firefox
    - Edge
  condition: selection_config_access and selection_api_call and selection_auth_header
    and not filter_browser_navigation
falsepositives:
- Legitimate single-page applications that load config files and then make API calls
  with embedded tokens
- Authorized API clients that read configuration files as part of their startup sequence
- Mobile applications that fetch settings and then make authenticated API calls
level: low
