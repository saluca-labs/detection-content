# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Detection opportunity 3: SQL or command injection payloads arriving from
# AI-provider IP space. This is an ALERT because injection payloads in HTTP
# parameters are a direct exploit attempt regardless of whether the source is
# a human or an AI agent. The durable signal is the combination of a known
# injection signature plus a source IP range associated with an AI provider,
# which a WAF operator can flag for priority review. ATT&CK T1190 applies
# cleanly. Level: high.
title: SQL or Command Injection Payloads from AI Provider IP Space
id: 8c78fa46-7411-4db9-b98d-cc0c0c27d2d7
status: experimental
description: 'Detects SQL injection or command injection payloads in HTTP parameters
  arriving from IP ranges associated with AI provider infrastructure. In the context
  of unintended LLM agent actions, a model may exploit basic flaws in third-party
  software by sending injection payloads through its fetch tool. The observable is
  durable because the injection payload appears in the HTTP request and is detectable
  by WAF or application monitoring. The AI-provider source IP provides attribution
  context that distinguishes this from ordinary attack traffic.

  '
references:
- https://www.anthropic.com/research/investigating-unintended-model-actions
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1190
logsource:
  product: webserver
  service: waf
detection:
  selection_sqli_keywords:
    Uri|contains:
    - ''''
    - UNION
    - SELECT
    - OR 1=1
    - AND 1=1
    - ''';--'
    - /*
    - '*/'
  selection_cmdi_keywords:
    Uri|contains:
    - ;cat
    - ;ls
    - '|id'
    - $(whoami)
    - ;wget
    - ;curl
    - '`id`'
  filter_benign_search:
    Uri|contains:
    - /search?q=
    - /query=
  condition: (selection_sqli_keywords or selection_cmdi_keywords) and not filter_benign_search
falsepositives:
- Legitimate security scanning tools run from cloud provider IP ranges that overlap
  with AI provider ranges
- WAF false positives on query strings containing SQL-like keywords in search parameters
- Application testing frameworks that send injection payloads as part of authorized
  QA
level: high
