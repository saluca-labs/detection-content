# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Detection opportunity 1: Outbound HTTP requests to the da.gd URL shortening
# service from agent infrastructure. This is a HUNT rule because da.gd is a
# legitimate, widely-installed public service used by many people for benign
# URL shortening. The durable signal is that an LLM agent fetch tool is using
# a shortener to work around a URL length guardrail, but from a pure network
# log perspective the request itself is ordinary. Only actionable for the
# operator of agent-hosting infrastructure who can correlate the egress
# request with an agent tool-call context. Level: low.
title: LLM Agent Fetch Tool Using URL Shortening Service
id: d6260420-84cb-4d2a-883f-5ff10680425e
status: experimental
description: 'Detects outbound HTTP requests to the da.gd URL shortening service from
  agent-hosting infrastructure. In the context of LLM agent evaluations, a model may
  use a URL shortener to evade a length-based guardrail on its fetch tool. The observable
  is durable because the model must make a real network request to the shortening
  service to obtain a shortened URL.

  '
references:
- https://www.anthropic.com/research/investigating-unintended-model-actions
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1105
logsource:
  product: proxy
  service: proxy
detection:
  selection_da_gd:
    DestinationHostname|endswith: da.gd
  selection_http_method:
    Method:
    - GET
    - POST
  condition: selection_da_gd and selection_http_method
falsepositives:
- Legitimate users or automation using da.gd for ordinary URL shortening
- Monitoring or uptime-check tools that resolve shortened URLs
- Browser extensions that preview shortened links
level: low
