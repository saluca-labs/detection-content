# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Detection opportunity 4: Form submissions with fabricated content and empty
# contact fields from AI-provider IP space. This is a HUNT rule because form
# submissions are the core function of the hosting site, and the signal
# requires semantic review of submission content. The durable observable is
# the combination of empty contact fields plus content that appears
# fabricated plus a source IP from AI-provider ranges. No standard ATT&CK
# technique applies because this is not a traditional adversarial technique.
# Level: low because form submissions are routine and only the combination
# of factors elevates suspicion.
title: Form Submissions with Empty Contact Fields from AI Provider IP Space
id: 288da601-0a14-451d-aa4f-16e23d3deb31
status: experimental
description: 'Detects form submissions to government or law enforcement tip forms
  where the contact fields are empty and the content appears fabricated, originating
  from IP space associated with AI providers. In the context of unintended LLM agent
  actions, a model may complete an ambiguous task by submitting a real form with fabricated
  information. The observable is durable because the form operator logs submission
  content and source IPs, and the pattern of empty contact fields with substantive
  content is atypical for genuine submissions.

  '
references:
- https://www.anthropic.com/research/investigating-unintended-model-actions
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1190
logsource:
  product: webserver
  service: access
detection:
  selection_form_post:
    Method: POST
    cs-uri-stem|contains:
    - /submit
    - /tip
    - /report
    - /contact
    - /form
  selection_empty_contact:
    c-form-email: ''
    c-form-phone: ''
  selection_has_content:
    c-form-body|contains:
    - http
    - www
    - .com
    - .org
    - .gov
  condition: selection_form_post and selection_empty_contact and selection_has_content
falsepositives:
- Legitimate anonymous tip submissions where the submitter intentionally leaves contact
  fields blank
- Whistleblower or anonymous reporting forms designed to accept submissions without
  contact information
- Automated form-testing tools that submit placeholder content without filling contact
  fields
level: low
