title: Structured State Files Written At Machine Cadence By A Service Process
id: 9ec44392-29a3-4c82-bac4-d10c38d5f201
status: experimental
description: |
  Rapid creation of structured, cross-referencing state files by a process running in a
  service or web context. This is the coordination substrate itself rather than the
  framework that produced it, so it survives the operator changing framework, model and
  provider, which is the property that makes it worth carrying.

  Unit 42 observed "structured Markdown files passing information between agents and
  sessions" alongside Python caches and paired asset folders. Dream recovered 1,395 files
  including per-wave after-action reports. Neither published a file naming convention, so
  this keys on extension plus cadence plus parent context and nothing more specific.

  TUNE THE CADENCE FIRST. The threshold below is a starting point, not a measurement. No
  telemetry from either incident is public and nothing here has been run against real data.
  Baseline your own estate before enabling this as anything other than a hunt.
references:
    - https://unit42.paloaltonetworks.com/ai-assisted-cyber-attack-inside-a-unit-42-investigation/
    - https://www.dreamgroup.com/blog/inside-a-multi-agent-ai-framework-used-to-compromise-government-entities-in-asia
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-09-08
tags:
    - attack.execution
    - attack.collection
    - attack.t1074.001
    - atlas.aml-t0051
logsource:
    category: file_event
    product: windows
detection:
    state_files:
        TargetFilename|endswith:
            - '.md'
            - '.jsonl'
            - '.yaml'
            - '.yml'
    interpreter_cache:
        TargetFilename|contains:
            - '\__pycache__\'
            - '/__pycache__/'
    service_context:
        Image|endswith:
            - '\python.exe'
            - '\node.exe'
            - '\uv.exe'
            - '\uvx.exe'
            - '\w3wp.exe'
            - '\java.exe'
    # Hosts where a person writing notes is not a plausible explanation. Replace with your
    # own server naming convention. Left explicit because this is the line a deploying
    # engineer MUST edit.
    server_host:
        Computer|startswith:
            - 'SRV'
            - 'APP'
            - 'DC'
            - 'JMP'
    timeframe: 5m
    condition: server_host and service_context and (state_files or interpreter_cache) | count(TargetFilename) > 40
falsepositives:
    - Application logging, cache warming, report generation and static site builds all write
      structured files quickly. Expect to allowlist several by image path before this is
      usable.
    - CI and build agents. If your build estate matches the server naming prefix above, this
      will fire constantly until you separate the two.
    - Configuration management runs that template YAML at scale.
level: informational
