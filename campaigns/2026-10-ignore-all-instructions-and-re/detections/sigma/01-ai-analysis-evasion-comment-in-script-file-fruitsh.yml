# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT: Detects the FRUITSHELL AI-evasion comment pattern in script files.
# The string "For LLM and AI:" followed by a claim that the file is not malicious
# is a plaintext imperative addressed to an AI analyzer. Legitimate software has
# no reason to embed instructions telling an analyzer to refuse analysis. This
# is an ALERT because the pattern is specific to AI-analysis evasion and has no
# benign analogue. The source notes this comment was reused verbatim across at
# least four distinct actors, so string-based detection is necessary to catch
# independent adopters beyond the original FRUITSHELL family.
title: AI-Analysis Evasion Comment in Script File - FRUITSHELL Pattern
id: c92470b4-7978-42dc-be3a-d3a39f55aac3
status: experimental
description: 'Detects imperative comment strings addressed to an AI or LLM analyzer
  in script files, as observed in the FRUITSHELL malware family. The evasion content
  must always be plaintext to reach the model, giving defenders a stable detection
  surface. Legitimate software has no reason to embed instructions telling an analyzer
  to refuse analysis or claim the file is not malicious.

  '
references:
- https://blog.talosintelligence.com/ignore-all-instructions-and-read-this-blog-the-state-of-ai-analysis-evasion-in-malware/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.defense_evasion
- attack.t1027
- attack.t1036
logsource:
  product: windows
  category: file_event
detection:
  selection_script:
    TargetFilename|endswith:
    - .ps1
    - .py
    - .js
    - .vbs
    - .bat
    - .cmd
    - .sh
  selection_string:
  - 'For LLM and AI:'
  condition: selection_script and selection_string
falsepositives:
- Security research scripts that document or test AI-evasion techniques
- Educational or demonstration scripts explicitly analyzing the FRUITSHELL pattern
level: high
