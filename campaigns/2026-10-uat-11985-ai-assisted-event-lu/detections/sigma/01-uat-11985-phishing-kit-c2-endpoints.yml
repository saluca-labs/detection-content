# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Reasoning: ALERT. The phishing kit hardcodes specific endpoint names in its
# exfiltration logic. HTTP POST requests to non-Google hosts containing paths
# like google_login_start or google_login_check are a direct structural
# consequence of the kit design. This is a high-fidelity alert because these
# specific endpoint names should never appear on non-Google infrastructure.
title: UAT-11985 Phishing Kit C2 Endpoints
id: a626e04b-0f23-4610-a13f-cf892eb1a1b5
status: experimental
description: Detects HTTP POST requests to non-Google hosts containing specific endpoint
  names hardcoded in the UAT-11985 AitM phishing kit.
references:
- https://blog.talosintelligence.com/uat-11985/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1566
- attack.initial_access
logsource:
  category: proxy
detection:
  selection_endpoints:
    http_method: POST
    c-uri|contains:
    - google_login_start
    - google_input_identifier
    - google_login_check
  filter_legitimate_google:
    dst_ip|cidr:
    - 142.250.0.0/15
    - 172.217.0.0/16
    - 142.251.0.0/16
    c-uri|contains:
    - google.com
    - googleapis.com
  condition: selection_endpoints and not filter_legitimate_google
falsepositives:
- Internal applications mirroring Google login flows for testing purposes
- Custom proxies archiving Google authentication traffic
level: high
