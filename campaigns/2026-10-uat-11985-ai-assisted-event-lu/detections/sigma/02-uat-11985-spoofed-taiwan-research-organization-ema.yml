# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Reasoning: ALERT. The actor fabricated sender identities while using
# legitimate Taiwan research organization names. Domain-authentication failure
# (SPF/DKIM/DMARC) combined with these specific display names is a direct
# consequence of the impersonation technique.
title: UAT-11985 Spoofed Taiwan Research Organization Email Senders
id: 1b578f96-038e-4281-8343-98cb65a8f3e9
status: experimental
description: Detects inbound email claiming to be from specific Taiwan research organizations
  where sender authentication fails.
references:
- https://blog.talosintelligence.com/uat-11985/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.t1566.001
- attack.t1584
- attack.initial_access
logsource:
  category: email
detection:
  selection_orgs:
    sender|contains:
    - Taiwan European Union Centre
    - NCCU Institute of International Relations
    - Taiwan Research Institute
  filter_auth_failure:
    authentication_result|contains:
    - fail
    - none
    - softfail
  condition: selection_orgs and filter_auth_failure
falsepositives:
- Legitimate emails from these organizations routed through misconfigured third-party
  mailing lists
- Forwarding services that break DKIM signatures
level: medium
