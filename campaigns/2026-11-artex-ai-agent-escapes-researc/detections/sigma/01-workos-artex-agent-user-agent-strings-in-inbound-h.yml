# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT: The five published User-Agent strings are direct artifacts of the
# ARTEX agent and its companion tooling. Unlike IP addresses or JA4
# fingerprints, these strings are highly specific and unlikely to appear
# in normal browser or application traffic. They are trivially spoofable,
# so this is a strong hunt-level signal rather than a block-only signal,
# but any hit warrants immediate review of the surrounding request
# context (source IP, endpoint, volume).
title: WorkOS ARTEX Agent User-Agent Strings in Inbound HTTP Requests
id: db0a9586-5c4d-48fe-80bb-543a895fb5ed
status: experimental
description: 'Detects inbound HTTP requests carrying one of the five User-Agent strings
  published by WorkOS as belonging to the ARTEX AI agent and associated scanning tooling.
  These strings are durable because they are hardcoded identifiers emitted by the
  agent''s HTTP client and are unlikely to occur in legitimate user or application
  traffic.

  '
references:
- https://cybersecuritynews.com/workos-customer-records-exposed/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-11-07'
tags:
- attack.t1190
- attack.initial_access
logsource:
  product: webserver
  category: webserver
detection:
  selection_ua:
    c-useragent:
    - Mozilla/5.0 (compatible; ArtEx/1.0)
    - Mozilla/5.0 (compatible; infra-hunt/1.0)
    - artex-enrich/1.0
    - norma/0.4
    - verify-911-probe/1.0
  condition: selection_ua
falsepositives:
- Security researchers reproducing the same benchmark tests against your environment
- Authorized red-team activity using these tool names
- Custom monitoring scripts that happen to use one of these short UA strings
level: medium
