# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Rule 3: Shell execution spawned by PHP process (web shell consequence).
# This is an ALERT rule. The source states threat actors used web shells for
# persistence on compromised web servers. Shell execution spawned by PHP is a
# direct consequence of web shell activity. This is a durable behavioral
# detection because PHP spawning a shell is almost always suspicious on a web
# server unless explicitly part of the application design.
title: Shell Execution Spawned by PHP Process
id: e12551f7-b3b5-4a81-86f2-0b77e67fe516
status: experimental
description: Detects a shell process spawned by a PHP process, which is a direct consequence
  of web shell activity used by Storm-3358 for persistence on compromised web servers.
references:
- https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-11-07'
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
    - /php
    - /php-fpm
    - /php-cgi
  selection_child:
    Image|endswith:
    - /sh
    - /bash
    - /dash
    - /zsh
    - /nc
    - /ncat
    - /python
    - /python3
    - /perl
  condition: selection_parent and selection_child
falsepositives:
- Legitimate web applications that intentionally execute shell commands via PHP
- Monitoring or deployment scripts that invoke PHP which then spawns shells
level: high
