# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Rule 4: Adding execute permission to downloaded file or directory.
# This is an ALERT rule. The source describes RATs being downloaded and
# launched. Adding execute permissions via chmod is a necessary consequence of
# making a downloaded binary runnable on Linux. This is durable because the
# chmod +x pattern on files in common download or temp directories is a strong
# behavioral indicator of tool deployment following ingress tool transfer.
title: Execute Permission Added to File in Common Download or Temp Directory
id: 59cba983-3d1b-4e9d-84f6-ec83fc035917
status: experimental
description: Detects chmod adding execute permissions to files in temporary or download
  directories, a necessary step for launching downloaded RATs such as WISP, vshell,
  or AdaptixC2 on Linux systems.
references:
- https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-11-07'
tags:
- attack.defense_evasion
- attack.t1222.002
logsource:
  product: linux
  category: process_creation
detection:
  selection_chmod:
    Image|endswith: /chmod
    CommandLine|contains:
    - +x
    - '0777'
    - '0755'
    - '0700'
    - u+x
  selection_paths:
    CommandLine|contains:
    - /tmp/
    - /var/tmp/
    - /dev/shm/
    - /home/
    - /root/
    - ./
  condition: selection_chmod and selection_paths
falsepositives:
- Legitimate software installation scripts that set execute permissions on downloaded
  binaries
- Developers setting execute permissions on scripts in their home directory
- Package managers or configuration management tools making binaries executable
level: medium
