# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# Rule 2: Curl downloading files from remote URLs (hunt for new downloads).
# This is a HUNT rule. The source describes ARTEX agents using curl to download
# RATs to compromised systems. The published hunting query looks for
# curl-initiated downloads of files not seen in the prior 7-day baseline.
# Curl is a widely-installed legitimate tool, so this requires baseline tuning
# and is inherently noisy. Level is low because of the high false positive rate
# from administrative curl usage.
title: Curl Downloading File from Remote URL
id: fc5a48d7-4ae2-45d0-9829-35497adec1dc
status: experimental
description: Hunts for curl downloading files from remote URLs, a behavior associated
  with ARTEX agents downloading RATs to compromised systems. Requires baseline tuning
  to identify new or anomalous download destinations.
references:
- https://www.microsoft.com/en-us/security/blog/2026/11/06/artex-abuse-expands-as-cybercriminals-target-financial-sector/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-11-07'
tags:
- attack.command_and_control
- attack.t1105
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: /curl
    CommandLine|contains:
    - http
    - https
  filter_download_flags:
    CommandLine|contains:
    - ' -o '
    - ' --output '
    - ' -O'
  condition: selection and filter_download_flags
falsepositives:
- Legitimate administrative scripts using curl to download updates or packages
- CI/CD pipelines using curl to fetch artifacts
- Package managers or configuration management tools invoking curl
level: low
