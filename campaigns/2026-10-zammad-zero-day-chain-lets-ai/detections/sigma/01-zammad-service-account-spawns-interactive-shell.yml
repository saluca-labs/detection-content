# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT: Zammad service account spawning an interactive shell is a direct
# consequence of CVE-2026-102489 granting RCE. A web application service
# user has no legitimate need to spawn bash, sh, python, or ruby interpreters
# during normal operation. This is a high-confidence trigger because the
# process context divergence from expected application behavior is immediate
# and unambiguous. The assessment notes the agent reached root within seconds,
# so this detection should feed directly into isolation workflows.
title: Zammad Service Account Spawns Interactive Shell
id: 9a0a8206-6c88-4749-a186-4079f4ade3a5
status: experimental
description: Detects the Zammad service account or equivalent web application service
  user spawning an interactive shell or interpreter, indicating RCE via CVE-2026-102489
  session hijack.
references:
- https://cybersecuritynews.com/zammad-zero-day/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_service_account:
    User|contains:
    - zammad
    - www-data
    - nginx
    - apache
  selection_shell:
    Image|endswith:
    - /bin/bash
    - /bin/sh
    - /bin/dash
    - /bin/zsh
    - /bin/ksh
    - /usr/bin/python
    - /usr/bin/python3
    - /usr/bin/ruby
    - /usr/bin/perl
  condition: selection_service_account and selection_shell
falsepositives:
- Legitimate administrative maintenance scripts executed by the service account
- Application deployment or update procedures that invoke shell wrappers
- Debugging sessions by authorized operators using the service account context
level: high
