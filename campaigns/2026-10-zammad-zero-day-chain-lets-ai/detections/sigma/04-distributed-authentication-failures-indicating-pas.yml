# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT: Repeated failed logins distributed across many distinct usernames from
# a single source or within a short window is a structural consequence of the
# password spraying technique described in the source. The attacker attempted
# password spraying, which tries common passwords across multiple accounts.
# This is a HUNT because authentication failure noise is common in production
# environments and thresholds must be tuned to the specific deployment. The
# detection looks for a high count of distinct usernames with authentication
# failures within a defined time window.
title: Distributed Authentication Failures Indicating Password Spraying
id: c904d082-cbbe-4261-bcf2-ac5740d0f097
status: experimental
description: Detects authentication failures distributed across many distinct usernames
  from a single source within a short time window, matching the password spraying
  behavior observed in the DIVD intrusion.
references:
- https://cybersecuritynews.com/zammad-zero-day/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.credential_access
- attack.t1110.003
logsource:
  product: linux
  category: authentication
detection:
  selection_failed:
    Outcome: success
    Outcome|contains: fail
  timeframe: 10m
  condition: selection_failed | count(User) by SourceIP > 15
falsepositives:
- Users mistyping credentials across multiple accounts on shared workstations
- Automated monitoring or health check systems testing multiple service accounts
- Load balancer or proxy health checks generating authentication attempts
- Legitimate SSO or directory synchronization tools with stale credentials
level: low
