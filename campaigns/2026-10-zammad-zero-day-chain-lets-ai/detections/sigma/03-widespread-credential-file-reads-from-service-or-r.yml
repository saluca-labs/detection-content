# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT: Widespread credential file reads from a service or root context are a
# post-compromise behavior explicitly recommended by Sysdig. After gaining RCE
# and root, credential harvesting is an inherent step. This detection looks for
# a single process reading /etc/shadow, /etc/passwd, or application configuration
# files containing secrets in rapid succession. This is a HUNT because legitimate
# backup agents, configuration management tools, and monitoring systems may also
# read these files; correlation with the Zammad service context or recent root
# transition is needed to elevate confidence.
title: Widespread Credential File Reads From Service or Root Context
id: 80ba471a-dbbb-4091-8c96-2e7e3623c269
status: experimental
description: Detects a single process or session reading multiple credential stores
  in rapid succession, a post-compromise credential harvesting pattern recommended
  by Sysdig.
references:
- https://cybersecuritynews.com/zammad-zero-day/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-14'
tags:
- attack.credential_access
- attack.t1552.001
logsource:
  product: linux
  category: file_event
detection:
  selection_credential_files:
    TargetFilename|endswith:
    - /etc/shadow
    - /etc/passwd
    - /etc/gshadow
    - /etc/group
  selection_app_config:
    TargetFilename|contains:
    - zammad
    - database.yml
    - secrets.yml
    - .env
    - config/database
  filter_known_tools:
    Image|endswith:
    - /usr/bin/backup
    - /usr/sbin/logrotate
    - /usr/bin/dpkg
    - /usr/bin/apt
    - /usr/bin/yum
    - /usr/bin/rpm
  condition: (selection_credential_files or selection_app_config) and not filter_known_tools
falsepositives:
- Backup agents reading configuration files as part of scheduled backup jobs
- Configuration management tools such as Ansible, Puppet, or Chef reading credential
  stores
- Monitoring systems collecting file integrity data on sensitive files
- Package managers reading /etc/passwd during installation or update operations
level: low
