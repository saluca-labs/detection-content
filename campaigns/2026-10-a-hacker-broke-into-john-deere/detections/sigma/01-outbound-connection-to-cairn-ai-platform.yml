# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT: This rule detects outbound connections to the Cairn open-source AI platform.
# The assessment notes that Norforge found more than 20 exposed Cairn instances that
# are "likely malicious." While Cairn is a general-purpose tool, outbound connections
# to it from a corporate network may indicate an internal actor using the platform
# or a compromised system communicating with a malicious Cairn instance. This is
# treated as an ALERT because the presence of this tool in a corporate environment
# warrants investigation, though it may also be used by legitimate developers.
# ATT&CK: No clear technique applies per the assessment, but it relates to T1105
# (Ingress Tool Transfer) as a possible indicator of tool download/use.
title: Outbound Connection to Cairn AI Platform
id: 4ef03da3-8c58-40e7-9dcf-13eccfe60983
status: experimental
description: Detects outbound network connections to the Cairn open-source AI platform,
  which was used by attackers to breach 100+ websites via automated AI agents. Presence
  of this traffic in a corporate environment may warrant investigation.
references:
- https://www.theverge.com/ai-artificial-intelligence/1013643/ai-agents-hack-john-deere-shark-ninja-cummins
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-19'
tags:
- attack.t1105
logsource:
  product: firewall
  category: network_connection
detection:
  selection_cairn_domain:
    DestinationHostname|endswith:
    - cairn.ai
    - cairn.io
    - cairn.dev
    - cairn.com
  selection_cairn_keyword:
    DestinationHostname|contains:
    - cairn
  filter_legitimate_domains:
    DestinationHostname|contains:
    - cairn.com.au
    - cairnspost.com.au
    - cairn.edu
  condition: (selection_cairn_domain or selection_cairn_keyword) and not filter_legitimate_domains
falsepositives:
- Legitimate developers or researchers using the Cairn open-source AI platform
- Connections to unrelated services that happen to contain "cairn" in their domain
  name
- Access to Cairn regional news or educational sites
level: medium
