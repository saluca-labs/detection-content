# Sigma rule collection - BoryptGrab-lineage infostealer via fake GitHub repos
#
# Campaign start: 2026-06-26. ~292 brand-impersonation repos.
# Chain: fake repo README -> *.github.io redirector -> distribution domain ->
#        ZIP with signed WinGUP gup.exe (renamed) + trojanized libcurl.dll ->
#        DLL sideload -> in-memory stealer -> POST /upload exfil to Proton66.
#
# Ref: https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
# Author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team, 2026-08-10
#
# This is a multi-document YAML file (a Sigma rule collection). pySigma and sigmac
# both read every document. Split with `yq` if your pipeline needs one rule per file.

title: libcurl.dll Sideloaded From User-Writable Path
id: 162e6576-9f99-4a78-81e0-3a8d34099eea
status: experimental
description: |
  Detects the BoryptGrab delivery mechanism: a legitimate signed WinGUP gup.exe, renamed to
  match the impersonated brand, loading a trojanized libcurl.dll out of the directory the
  victim extracted the ZIP into. Legitimate software ships libcurl.dll inside Program Files,
  never out of Downloads, Desktop, or a temp extraction directory.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
    - https://www.bleepingcomputer.com/news/security/nearly-300-github-repos-pose-as-legit-software-to-push-malware/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.defense-evasion
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1574.001
    - attack.t1574.002
logsource:
    category: image_load
    product: windows
detection:
    load_libcurl:
        ImageLoaded|endswith: '\libcurl.dll'
    user_writable_paths:
        ImageLoaded|contains:
            - '\Downloads\'
            - '\Desktop\'
            - '\AppData\Local\Temp\'
            - '\AppData\Roaming\'
            - '\Users\Public\'
            - '\Windows\Temp\'
    condition: load_libcurl and user_writable_paths
falsepositives:
    - Portable applications and developer toolchains legitimately run from a Downloads or
      Desktop folder and can ship their own libcurl.dll. Triage on the loading image's
      signature and on whether a sibling EXE was renamed away from gup.exe.
    - Self-extracting installers that stage to %TEMP% before writing to Program Files.
level: high

