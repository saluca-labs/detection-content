title: Signed WinGUP Updater Renamed To A Vendor Brand Name
id: e8856dc4-8d0c-4405-9977-46b8c0f88ef4
status: experimental
description: |
  The campaign ships the genuine, validly signed Notepad++ WinGUP updater (gup.exe) renamed
  to the impersonated product, for example Arctic-Wolf-6.86.5.exe. The signature stays valid
  and the original filename in the version resource still reads gup.exe, so a mismatch
  between OriginalFileName and Image is the giveaway.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.defense-evasion
    - attack.t1036.003
    - attack.t1574.002
logsource:
    category: process_creation
    product: windows
detection:
    winGUP:
        OriginalFileName: 'gup.exe'
    renamed:
        Image|endswith: '\gup.exe'
    condition: winGUP and not renamed
falsepositives:
    - Notepad++ installations that repackage the updater under a different name. Rare.
level: high

---

title: BoryptGrab Stealer Staging Directory Or Output Artifact Created
id: 0b4b0633-980c-403d-8a82-71cab5a03afd
status: experimental
description: |
  The stealer has no cleanup routine and leaves its full working directory on disk. The
  Filegraber misspelling is the single highest-fidelity artifact in the family. Any hit here
  means the payload already executed and data was already collected. Treat as post-exfil.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.collection
    - attack.credential-access
    - attack.t1005
    - attack.t1552.001
    - attack.t1113
logsource:
    category: file_event
    product: windows
detection:
    misspelled_dir:
        TargetFilename|contains: '\Filegraber'
    output_files:
        TargetFilename|endswith:
            - '\browser_decryption.log'
            - '\UserInformation.txt'
            - '\credentials_data.txt'
            - '\Discord_tokens.txt'
            - '\steam_accounts.txt'
            - '\installed_applications.txt'
            - '\sends.log'
    staging_tree:
        TargetFilename|contains:
            - '\decrypt_browser\'
            - '\Messenger\Max\credentials.txt'
    condition: 1 of them
falsepositives:
    - Effectively none. These filenames are not produced by legitimate software.
level: critical

