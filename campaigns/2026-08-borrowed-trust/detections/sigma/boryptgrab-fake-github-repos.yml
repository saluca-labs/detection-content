title: Chrome App-Bound Encryption Bypass Via Remote Thread Into Browser
id: a37a4534-5a22-4862-b8c9-3d18b7762fad
status: experimental
description: |
  The stealer defeats Chrome App-Bound Encryption by launching the browser itself with
  CreateProcessW, allocating 0x21600 bytes with VirtualAllocEx, writing a ~134KB DLL,
  resolving its Bootstrap export, and calling CreateRemoteThread. Detects the remote thread
  into a browser process from a source that is not itself a browser or a known injector.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.credential-access
    - attack.defense-evasion
    - attack.t1055.001
    - attack.t1555.003
logsource:
    category: create_remote_thread
    product: windows
detection:
    target_browser:
        TargetImage|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\vivaldi.exe'
            - '\yandex.exe'
    source_is_browser:
        SourceImage|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\vivaldi.exe'
            - '\yandex.exe'
    known_good_sources:
        SourceImage|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
        SourceImage|endswith:
            - '\svchost.exe'
            - '\csrss.exe'
            - '\wininit.exe'
    condition: target_browser and not source_is_browser and not known_good_sources
falsepositives:
    - Endpoint DLP, session-recording, and browser-isolation agents inject into browsers by design. Allowlist them by SourceImage.
    - Accessibility and password-manager helpers.
level: high

