title: Browser Process Memory Read By Non-Browser Process
id: e7a9008e-6b71-413a-a1e4-35e8e1ce2e8d
status: experimental
description: |
  Complements the remote-thread rule. Catches credential-store access via direct memory
  reads against browser processes, including the App-Bound bypass and the fallback paths.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.credential-access
    - attack.t1555.003
logsource:
    category: process_access
    product: windows
detection:
    target_browser:
        TargetImage|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\firefox.exe'
    vm_read:
        GrantedAccess|contains:
            - '0x1410'
            - '0x1010'
            - '0x143a'
            - '0x1f3fff'
    source_is_browser:
        SourceImage|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\brave.exe'
            - '\firefox.exe'
    condition: target_browser and vm_read and not source_is_browser
falsepositives:
    - EDR and AV agents. Allowlist by SourceImage.
    - Crash reporters and telemetry helpers belonging to the browser vendor.
level: medium

