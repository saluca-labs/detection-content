title: BoryptGrab Exfiltration Over Plaintext HTTP POST /upload
id: e267d0b5-7b74-48b4-b8d1-2e47adf8bbfc
status: experimental
description: |
  The stealer packages everything into a ZIP and pushes it over a raw Winsock plaintext HTTP
  POST to /upload with X-Filename and X-Size headers and chunked transfer encoding, straight
  to a hardcoded Proton66 IP with no domain and no TLS.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.exfiltration
    - attack.t1048.003
    - attack.t1041
logsource:
    category: proxy
detection:
    method_path:
        cs-method: 'POST'
        cs-uri-stem: '/upload'
    custom_headers:
        cs-header|contains:
            - 'X-Filename'
            - 'X-Size'
    plaintext_to_ip:
        cs-uri-scheme: 'http'
    condition: method_path and (custom_headers or plaintext_to_ip)
falsepositives:
    - Internal file-upload endpoints that happen to sit at /upload. Scope by destination reputation.
level: high

