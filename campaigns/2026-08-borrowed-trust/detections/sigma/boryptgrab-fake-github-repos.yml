title: Steam Client Memory Scraped For Session Tokens
id: a5cbc24c-d587-4081-ab5b-9eee06cb9b35
status: experimental
description: |
  Module 7 of the stealer launches Steam if it is not running, waits 20 seconds for
  initialization, then reads steamwebhelper.exe and steamservice.exe process memory for
  session tokens. Nothing legitimate reads those two processes.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.credential-access
    - attack.t1528
    - attack.t1005
logsource:
    category: process_access
    product: windows
detection:
    steam:
        TargetImage|endswith:
            - '\steamwebhelper.exe'
            - '\steamservice.exe'
    steam_family:
        SourceImage|endswith:
            - '\steam.exe'
            - '\steamwebhelper.exe'
            - '\steamservice.exe'
    condition: steam and not steam_family
falsepositives:
    - EDR and anti-cheat drivers. Allowlist by SourceImage.
level: high

