title: Mass Browser Termination Preceding Credential Theft
id: ebb6164e-92d7-4c70-8e39-070f1421e99a
status: experimental
description: |
  KillBrowserProcesses terminates chrome, firefox, vivaldi, opera, brave, and msedge before
  reading their credential stores, so the databases are unlocked and not in use. Alert on a
  single process terminating three or more distinct browsers inside a short window.
  Correlation rule - requires a backend that supports Sigma correlations.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.defense-evasion
    - attack.credential-access
    - attack.t1489
logsource:
    category: process_access
    product: windows
detection:
    browsers:
        TargetImage|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\vivaldi.exe'
            - '\opera.exe'
            - '\brave.exe'
            - '\msedge.exe'
    terminate:
        GrantedAccess|contains: '0x1'
    condition: browsers and terminate
falsepositives:
    - Browser updaters restarting their own product.
    - User-initiated Task Manager kills.
level: low

