title: BoryptGrab Fake Download Page Or Payload Endpoint Accessed
id: 6b5161bc-2880-4f70-a597-c2a8366e01db
status: experimental
description: |
  The distribution hosts serve one templated gh-downloader page across all ~292 impersonated
  brands. The payload endpoint takes a rotating user_code and the referring github.io domain,
  and returns a freshly rebuilt ZIP roughly every 60 seconds. The URI shape survives the
  domain rotation, so this outlives any single-domain block.
references:
    - https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.initial-access
    - attack.command-and-control
    - attack.t1189
    - attack.t1608.001
logsource:
    category: proxy
detection:
    payload_endpoint:
        cs-uri-query|contains|all:
            - 'user_code='
            - 'domain='
    payload_path:
        cs-uri-stem|contains: '/download-archive'
    github_io_referrer_to_nongithub:
        cs-referrer|contains: '.github.io'
    condition: payload_path and (payload_endpoint or github_io_referrer_to_nongithub)
falsepositives:
    - Legitimate services using a /download-archive route. Confirm the destination is not a CDN and not the vendor's real domain.
level: high
