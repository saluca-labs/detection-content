# Sigma rule collection - "Free VPN for PC" GitHub repo -> Lumma Stealer
#
# GitHub user SAMAIOEC, repos free-vpn-for-pc and minecraft-skin.
# Chain: Launch.exe (1.52MB, base64 payload hidden after 1177 chars of French filler text) ->
#        drops %APPDATA%\msvcp110.dqq -> renames to msvcp110.dll -> LoadLibrary ->
#        GetGameData export -> injects into MSBuild.exe and aspnet_regiis.exe -> Lumma Stealer.
#
# Ref: https://www.cyfirma.com/research/github-abused-to-spread-malware-disguised-as-free-vpn/
# Author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team, 2026-08-10

title: Lumma Dropper Stages msvcp110 In AppData Roaming Root
id: 2f8ce7c6-b944-40bf-832e-4b81fead176a
status: experimental
description: |
  Launch.exe writes its payload as %APPDATA%\msvcp110.dqq then renames it to msvcp110.dll to
  masquerade as the Visual C++ runtime. A genuine msvcp110.dll lives in System32, SysWOW64, or
  an application directory, never loose in the Roaming root. The .dqq staging extension is
  unique enough to alert on by itself.
references:
    - https://www.cyfirma.com/research/github-abused-to-spread-malware-disguised-as-free-vpn/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.defense-evasion
    - attack.execution
    - attack.t1036.005
    - attack.t1574.001
logsource:
    category: file_event
    product: windows
detection:
    staging_ext:
        TargetFilename|endswith: '.dqq'
    masquerade_dll:
        TargetFilename|endswith: '\msvcp110.dll'
    roaming_root:
        TargetFilename|contains: '\AppData\Roaming\'
    subfolder:
        TargetFilename|contains:
            - '\AppData\Roaming\Microsoft\'
            - '\AppData\Roaming\Adobe\'
    condition: staging_ext or (masquerade_dll and roaming_root and not subfolder)
falsepositives:
    - Portable applications bundling their own VC++ runtime into a Roaming subfolder. The subfolder filter handles the common cases.
level: high

