title: Injection Into MSBuild.exe Or aspnet_regiis.exe From Non-Developer Parent
id: a1afba91-0feb-477d-8f50-c6c2cd0f7c0c
status: experimental
description: |
  The Lumma chain hollows two signed .NET Framework utilities, MSBuild.exe and
  aspnet_regiis.exe, as living-off-the-land injection hosts. Neither should be spawned by a
  binary sitting in Downloads or AppData. This rule is deliberately broader than the single
  campaign, since these two targets are reused across many commodity stealer chains.
references:
    - https://www.cyfirma.com/research/github-abused-to-spread-malware-disguised-as-free-vpn/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.defense-evasion
    - attack.execution
    - attack.t1055.012
    - attack.t1127.001
logsource:
    category: process_creation
    product: windows
detection:
    lolbin_targets:
        Image|endswith:
            - '\MSBuild.exe'
            - '\aspnet_regiis.exe'
    suspicious_parent:
        ParentImage|contains:
            - '\AppData\Roaming\'
            - '\AppData\Local\Temp\'
            - '\Downloads\'
            - '\Desktop\'
            - '\Users\Public\'
            - '\Windows\Temp\'
    no_args:
        CommandLine|endswith:
            - 'MSBuild.exe'
            - 'MSBuild.exe '
            - 'aspnet_regiis.exe'
            - 'aspnet_regiis.exe '
    condition: lolbin_targets and (suspicious_parent or no_args)
falsepositives:
    - CI agents and IDEs invoking MSBuild from a temp working directory. Allowlist by ParentImage.
    - The no_args branch is the stronger signal - a real build always carries a project path.
level: high

