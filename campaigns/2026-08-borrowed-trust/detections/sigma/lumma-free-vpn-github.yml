title: Lumma Free VPN Campaign C2 Contacted
id: f28a79a9-7017-4414-a85c-80a00fb073cf
status: stable
description: |
  Direct IOC match on the Lumma C2 set published with the Free VPN for PC campaign. Note the
  heavy use of the .sbs TLD, which carries very little legitimate enterprise traffic and is a
  reasonable candidate for a blanket block independent of these specific hosts.
references:
    - https://www.cyfirma.com/research/github-abused-to-spread-malware-disguised-as-free-vpn/
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.command-and-control
    - attack.t1071.001
logsource:
    category: dns_query
    product: windows
detection:
    c2_domains:
        QueryName|contains:
            - 'explorationmsn.store'
            - 'snailyeductyi.sbs'
            - 'ferrycheatyk.sbs'
            - 'deepymouthi.sbs'
            - 'wrigglesight.sbs'
            - 'captaitwik.sbs'
            - 'sidercotay.sbs'
            - 'heroicmint.sbs'
            - 'monstourtu.sbs'
    condition: c2_domains
falsepositives:
    - Threat-intel tooling resolving IOCs deliberately.
level: critical
