title: FDMTP Implant Artifacts Written Under quickfox Temp Tree
id: f58d2961-c574-40b7-99b8-c2b3958438b2
status: experimental
description: |
  Detects the FDMTP staging directory, the AES-encrypted payload container update.bin, and
  the one-byte file-based mutex data.dat that the implant uses to prevent re-infection.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.execution
    - attack.defense-evasion
    - attack.t1027
logsource:
    category: file_event
    product: windows
detection:
    mutex_file:
        TargetFilename|endswith: '\quickfox\data.dat'
    staging_dir:
        TargetFilename|contains: '\quickfox\updated\'
    payload_container:
        TargetFilename|endswith: '\update.bin'
    quickfox_scope:
        TargetFilename|contains: '\quickfox\'
    condition: mutex_file or staging_dir or (payload_container and quickfox_scope)
falsepositives:
    - A legitimate QuickFox install writes under this tree, but not data.dat or an updated\ subdirectory containing csmonitor.exe.
level: critical

