title: QuickFox Electron Renderer Fetching Remote Script
id: 39c151c4-888f-4431-8541-c7499e631519
status: experimental
description: |
  Two JavaScript lines were injected into the Electron renderer at
  resources\app.asar\candy\core\service\index.html to pull and execute a remote loader.
  Detects modification of that file, which should only ever change during a legitimate
  vendor upgrade.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.initial-access
    - attack.persistence
    - attack.t1195.002
logsource:
    category: file_event
    product: windows
detection:
    renderer:
        TargetFilename|contains: '\candy\core\service\'
        TargetFilename|endswith: '\index.html'
    asar_tree:
        TargetFilename|contains: '\app.asar'
    condition: renderer or (asar_tree and renderer)
falsepositives:
    - Legitimate QuickFox upgrades rewrite this file. Correlate with the installer version and with any subsequent request to cdns3.51quickfox.cn.
level: medium

