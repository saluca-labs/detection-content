title: QuickFox Trojanized Update Infrastructure Contacted
id: 0ad7e925-7120-4413-ae8f-46b8b265dcfb
status: stable
description: |
  cdns3.51quickfox.cn typosquats the vendor's real domain 51quickfox.com by swapping the TLD.
  It served the malicious loader as firebase-app-compat.js alongside a decoy analytics file,
  plus the update.zip payload. Any resolution of this host means a trojanized client build
  reached out.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.command-and-control
    - attack.initial-access
    - attack.t1071.001
    - attack.t1195.002
logsource:
    category: dns_query
    product: windows
detection:
    loader_host:
        QueryName|contains: 'cdns3.51quickfox.cn'
    fdmtp_staging:
        QueryName|contains:
            - 'icloud-cdn.net'
            - 'google-apis.net'
            - 'yahoo-cdn.it.com'
            - 'wangmeng.xyz'
            - 'wangmengsb.com'
            - 'wangmeng66.top'
            - 'techcheck1.com'
    condition: 1 of them
falsepositives:
    - Threat-intel tooling resolving IOCs deliberately.
level: critical

