title: FDMTP Registry Persistence Under HKCU IME Key
id: 6730b546-546a-47d4-b69d-065a44192a3e
status: experimental
description: |
  FDMTP persists configuration in HKCU\SOFTWARE\Microsoft\IME\{HWID}, hiding among the input
  method editor keys. Legitimate IME subkeys are short vendor names such as IMEJP or IMETC,
  never a hardware ID. Tune the exclusion list against a known-good gold image before enabling.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.persistence
    - attack.defense-evasion
    - attack.t1112
    - attack.t1547
logsource:
    category: registry_set
    product: windows
detection:
    ime_key:
        TargetObject|contains: '\SOFTWARE\Microsoft\IME\'
    known_ime_subkeys:
        TargetObject|contains:
            - '\IME\IMEJP'
            - '\IME\IMEKR'
            - '\IME\IMETC'
            - '\IME\IMESC'
            - '\IME\IMEPY'
            - '\IME\IMEWB'
            - '\IME\Cache'
    ime_owner_processes:
        Image|endswith:
            - '\ctfmon.exe'
            - '\svchost.exe'
            - '\imewdbld.exe'
            - '\explorer.exe'
    condition: ime_key and not known_ime_subkeys and not ime_owner_processes
falsepositives:
    - Third-party input method editors. Baseline your fleet, then allowlist by Image.
level: high

