title: Outbound Connection To FDMTP Cluster Node Or Port Range
id: 08f0acd0-c7f1-4dc2-a44a-134ec65d4fe5
status: experimental
description: |
  FDMTP nodes listen on a tight port range, 20800 to 20816, across a known set of Alibaba
  Cloud and bulletproof addresses. The port range alone is a useful low-noise hunt because
  almost nothing legitimate on a corporate endpoint speaks outbound on those ports.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.command-and-control
    - attack.t1571
logsource:
    category: network_connection
    product: windows
detection:
    cluster_ips:
        DestinationIp:
            - '47.238.64.56'
            - '47.239.93.49'
            - '47.239.4.179'
            - '47.88.21.252'
            - '47.238.240.219'
            - '154.223.75.206'
            - '154.223.58.64'
            - '45.158.180.250'
            - '154.223.58.142'
            - '38.60.142.56'
    cluster_ports:
        DestinationPort:
            - 20800
            - 20801
            - 20802
            - 20803
            - 20804
            - 20805
            - 20806
            - 20807
            - 20808
            - 20809
            - 20810
            - 20811
            - 20812
            - 20813
            - 20814
            - 20815
            - 20816
    initiated:
        Initiated: 'true'
    condition: initiated and (cluster_ips or cluster_ports)
falsepositives:
    - The port-range branch can hit custom internal services. Restrict to non-RFC1918 destinations if noisy.
level: high

