title: FDMTP Cluster Registration Request
id: 803ec4d4-26f4-4385-abfd-c870ebee2e6c
status: experimental
description: |
  Before connecting, FDMTP registers with a staging domain to obtain its live C2 node list.
  The request carries a fixed protocol identifier, DotNet-TcpFDMTP, which is unique to this
  implant family and survives both domain and endpoint-name rotation. The endpoint name
  itself rotates across GetCluster, GetSlaver, GetGateways, GetEndpoints, GetServers,
  GetHosts, and GetNodes, so key on the protocol parameter rather than the path.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.command-and-control
    - attack.t1071.001
    - attack.t1102
logsource:
    category: proxy
detection:
    protocol_param:
        cs-uri-query|contains: 'protocol=DotNet-TcpFDMTP'
    endpoint_names:
        cs-uri-stem|endswith:
            - '/GetCluster'
            - '/GetSlaver'
            - '/GetGateways'
            - '/GetEndpoints'
            - '/GetServers'
            - '/GetHosts'
            - '/GetNodes'
    staging_domains:
        cs-host|contains:
            - 'icloud-cdn.net'
            - 'google-apis.net'
            - 'yahoo-cdn.it.com'
            - 'wangmeng.xyz'
            - 'wangmengsb.com'
            - 'wangmeng66.top'
            - 'techcheck1.com'
    condition: protocol_param or staging_domains or (endpoint_names and not staging_domains and protocol_param)
falsepositives:
    - None expected. DotNet-TcpFDMTP is not a legitimate protocol identifier.
level: critical

