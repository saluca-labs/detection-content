# Sigma rule collection - QuickFox VPN supply chain -> FDMTP implant
#
# The vendor's own Windows installer was trojanized from v3.0.51.0 through v3.59.5, roughly
# 2025-07-25 to disclosure. Fixed in 3.59.6. FDMTP is associated with Mustang Panda.
#
# Chain: injected JS in the Electron renderer index.html -> loader from cdns3.51quickfox.cn ->
#        victim validation (26-app allowlist, steam.exe kill switch) -> csmonitor.exe sideloads
#        Microsoft.ServiceHosting.Tools.dll -> AES-decrypt update.bin -> FDMTP Client.dll.
#
# Ref: https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
# Author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team, 2026-08-10

title: FDMTP Sideload Pair csmonitor.exe Loading Microsoft.ServiceHosting.Tools.dll
id: 6aee2194-1b4e-472a-83d3-0cb4acae87c4
status: experimental
description: |
  FDMTP sideloads through csmonitor.exe, the legitimate Windows Azure Compute and Storage
  Emulator binary, dropped into %LOCALAPPDATA%\Temp\quickfox\updated\. The Azure emulator has
  no business running from a temp directory on an endpoint, and pairing it with
  Microsoft.ServiceHosting.Tools.dll outside its install root is the sideload itself.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.defense-evasion
    - attack.persistence
    - attack.t1574.002
logsource:
    category: image_load
    product: windows
detection:
    sideload_dll:
        Image|endswith: '\csmonitor.exe'
        ImageLoaded|endswith: '\Microsoft.ServiceHosting.Tools.dll'
    temp_path:
        ImageLoaded|contains:
            - '\AppData\Local\Temp\'
            - '\AppData\Roaming\'
            - '\Windows\Temp\'
            - '\quickfox\'
    condition: sideload_dll or (sideload_dll and temp_path)
falsepositives:
    - Genuine Azure SDK emulator installs. Those load from Program Files, not from a temp path.
level: critical

---

title: csmonitor.exe Executing From A Temp Or Roaming Path
id: 6e86237c-c7d7-4ce4-90fe-6d210e7c2999
status: experimental
description: |
  Catches the FDMTP loader host even when image-load telemetry is unavailable. The Azure
  emulator binary running out of a user-writable path is anomalous on any endpoint.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.defense-evasion
    - attack.t1574.002
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\csmonitor.exe'
    user_writable:
        Image|contains:
            - '\AppData\Local\Temp\'
            - '\AppData\Roaming\'
            - '\Windows\Temp\'
            - '\Users\Public\'
            - '\Downloads\'
    condition: selection and user_writable
falsepositives:
    - None expected on an endpoint. On an Azure developer workstation, confirm the path.
level: high

