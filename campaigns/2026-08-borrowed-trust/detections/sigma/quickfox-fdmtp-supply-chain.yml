title: FDMTP Victim Validation Application Survey
id: 5f5361da-d715-4477-b967-09569c15e679
status: experimental
description: |
  Hunt rule, not an alert. The JS loader only deploys FDMTP when at least one of 26 target
  applications is running, and aborts outright if steam.exe is present, to dodge consumer
  gaming machines. The list is the clearest statement of intent in the campaign: SSH and
  terminal clients, database tools, IDEs, crypto wallets, and Chinese-market translation
  software. Use this to identify which of your endpoints would have been selected had the
  trojanized client landed, and prioritise those for deeper forensics.
references:
    - https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-08-10
tags:
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    target_apps:
        Image|endswith:
            - '\xshell.exe'
            - '\finalshell.exe'
            - '\MobaXterm.exe'
            - '\Tabby.exe'
            - '\navicat.exe'
            - '\dbeaver.exe'
            - '\git.exe'
            - '\idea64.exe'
            - '\sublime_text.exe'
            - '\notepad++.exe'
            - '\Code.exe'
            - '\Exodus.exe'
            - '\Binance.exe'
            - '\telegram.exe'
            - '\SafeW.exe'
            - '\Hello-GPT.exe'
            - '\posend.exe'
    condition: target_apps
falsepositives:
    - This fires constantly in any development environment by design. Run it as a scoping query, never as an alert.
level: informational
