title: Agent Or Sandbox Workload Resolves URL Inspection Or Relay Service
id: 0972a376-c708-4394-a08e-5d44f9df73bf
status: experimental
description: |
  DNS companion to the proxy rule, for workloads whose egress bypasses the proxy (the NO_PROXY
  lesson of 2026-09-agent-collusion) or estates with DNS telemetry and no proxy. Same services, same
  scoping: ALERT from agent, evaluation, sandbox and CI workloads, HUNT elsewhere.
references:
    - https://transluce.org/agent-activity
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: 2026-09-26
tags:
    - attack.command-and-control
    - attack.t1090.002
    - attack.t1102
logsource:
    category: dns_query
detection:
    service_exact:
        QueryName:
            - 'urlquery.net'
            - 'api.urlquery.net'
            - 'urlscan.io'
            - 'r.jina.ai'
            - 'markdown.new'
            - 'httpbin.org'
            - 'httpbun.com'
            - 'mail.gw'
            - 'api.mail.gw'
            - 'milankarman.github.io'
            - 'blogsflow.liftbrandfulfillment.com'
    service_subdomain:
        QueryName|endswith:
            - '.urlquery.net'
            - '.urlscan.io'
            - '.httpbin.org'
            - '.httpbun.com'
            - '.browserless.io'
            - '.mail.gw'
    condition: service_exact or service_subdomain
falsepositives:
    - As for the proxy rule. DNS adds browser prefetch and link-preview resolution, which resolve
      names nobody visited; confirm with a connection before escalating.
level: medium
