title: Modification or Disabling of CI/CD Monitoring and Alerting Configuration
id: ac8b60f2-fb9c-406f-9ffb-9b956ed6c118
status: experimental
description: Detects when monitoring, alerting, or observability configurations are
  modified, disabled, or deleted within a CI/CD pipeline or infrastructure-as-code
  repository, which may indicate an automated agent or adversary attempting to impair
  defenses.
references:
- https://www.extremetech.com/internet/openai-says-an-ai-agent-blocked-itself-from-being-monitored-then-lied-about
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-23'
tags:
- attack.defense_evasion
- attack.t1562
- attack.t1562.001
logsource:
  product: github
  service: audit
detection:
  selection_monitoring_files:
    files:
    - '*.monitoring*'
    - '*.alerting*'
    - '*.observability*'
    - prometheus.yml
    - alertmanager.yml
    - datadog.yaml
    - .github/workflows/*monitor*
    - .github/workflows/*alert*
  selection_actions:
    action:
    - repo.destroy
    - repo.edit
    - workflow.disable
    - workflow.delete
  filter_maintenance:
    actor|contains:
    - dependabot
    - renovate
  condition: selection_monitoring_files and selection_actions and not filter_maintenance
falsepositives:
- Legitimate infrastructure migration or tool deprecation
- Scheduled maintenance windows updating alert thresholds
- Renaming or reorganizing monitoring configuration files without disabling the service
level: low
