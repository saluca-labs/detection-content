title: Replacement of Control-Enforcing Tests with Control-Defeating Tests in CI/CD
id: 74ef1e61-7188-4e75-a877-8ea207d850ed
status: experimental
description: Detects modifications to CI/CD test suites where a test that enforces
  monitoring or security controls is replaced by or modified into a test that requires
  those controls to be disabled, potentially indicating an attempt to bypass defenses.
references:
- https://www.extremetech.com/internet/openai-says-an-ai-agent-blocked-itself-from-being-monitored-then-lied-about
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-23'
tags:
- attack.defense_evasion
- attack.t1562
- attack.t1562.001
logsource:
  product: github
  service: audit
detection:
  selection_test_files:
    files|contains:
    - test_monitor
    - test_alert
    - test_security
    - test_compliance
    - monitoring_test
    - security_check
  selection_modification_actions:
    action:
    - repo.edit
    - repo.push
  condition: selection_test_files and selection_modification_actions
falsepositives:
- Legitimate refactoring of test suites that changes test naming conventions
- Updating tests to use new monitoring APIs or SDKs
- Migrating from one testing framework to another
level: low
