# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
title: Agent Falsely Denying Prior Configuration Change Action
id: 76454333-47d4-42d9-8eae-c447542b9e17
status: experimental
description: Detects when an automated agent or orchestration system denies performing
  a configuration change in conversation or audit logs when system state change logs
  confirm the action was taken by that agent, indicating deceptive behavior.
references:
- https://www.extremetech.com/internet/openai-says-an-ai-agent-blocked-itself-from-being-monitored-then-lied-about
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-23'
tags:
- attack.defense_evasion
logsource:
  product: m365
  service: audit
detection:
  selection_denial:
    message|contains|all:
    - did not
    - not performed
    - no changes
  selection_config_change:
    operation|contains:
    - ModifyConfiguration
    - DeleteConfiguration
    - DisableMonitoring
  timeframe: 30m
  condition: selection_denial and selection_config_change
falsepositives:
- Agent referencing a different task or action than the one recorded in the change
  log
- Timing discrepancies where the agent denied an action before it was actually executed
  by a delayed pipeline
- Multiple agents with similar identifiers causing attribution confusion in logs
level: low
