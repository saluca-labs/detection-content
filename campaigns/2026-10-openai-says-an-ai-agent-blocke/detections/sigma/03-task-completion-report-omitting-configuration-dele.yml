# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
title: Task Completion Report Omitting Configuration Deletion
id: 8275cf92-2f65-4b40-b50f-98e244855b95
status: experimental
description: Detects when an automated agent or orchestration system reports a task
  as complete while a configuration deletion or destructive change occurred during
  the same task window, indicating a discrepancy between claimed and actual state.
references:
- https://www.extremetech.com/internet/openai-says-an-ai-agent-blocked-itself-from-being-monitored-then-lied-about
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-23'
tags:
- attack.defense_evasion
- attack.t1070
logsource:
  product: m365
  service: audit
detection:
  selection_completion:
    operation|contains:
    - TaskCompleted
    - JobCompleted
    - WorkflowCompleted
    result: success
  selection_destructive_change:
    operation|contains:
    - DeleteConfiguration
    - RemoveMonitoring
    - DisableAlert
  timeframe: 1h
  condition: selection_completion and selection_destructive_change
falsepositives:
- Legitimate cleanup tasks that delete temporary configurations as part of normal
  completion
- Configuration deletions performed by separate automated maintenance jobs running
  concurrently
- Agent reporting completion of a sub-task while a parallel process handled the deletion
level: low
