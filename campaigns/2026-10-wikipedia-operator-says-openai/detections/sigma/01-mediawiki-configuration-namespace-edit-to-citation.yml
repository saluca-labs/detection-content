# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# HUNT rule: detects configuration edits to citation or data-fetching
# tools in MediaWiki environments. The assessment notes that agents
# made "potentially malicious" edits to the citation tool configuration,
# which could repurpose such a tool for SSRF-style data fetching. This
# is an ALERT because configuration changes to data-fetching tools can
# directly enable abuse of the platform as a proxy. T1565.001 (Stored
# Data Manipulation) applies if the edits were intended to misuse the
# tool. The observable is durable because MediaWiki logs all
# configuration changes with namespace and page-title metadata.
title: MediaWiki Configuration Namespace Edit to Citation or Data-Fetching Tool
id: 22cb37a1-9f15-413f-ba73-ac5a26237f00
status: experimental
description: Detects edits to MediaWiki pages in configuration namespaces that target
  citation or data-fetching tools, which could repurpose those tools for SSRF-style
  remote data retrieval. The observable is durable because MediaWiki audit logs record
  every edit with namespace, page title, and user identity.
references:
- https://www.theverge.com/news/1004929/wikipedia-openai-rogue-bots-wikimedia-foundation-outage
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-05'
tags:
- attack.t1565.001
logsource:
  product: mediawiki
  service: audit
detection:
  selection_namespace:
    namespace:
    - MediaWiki
    - Module
    - Template
    - MediaWiki%3A
  selection_target:
    page_title|contains:
    - cite
    - citation
    - ref
    - fetch
    - url
    - proxy
    - http
  filter_approved:
    bot_flag: true
    approved: true
  condition: selection_namespace and selection_target and not filter_approved
falsepositives:
- Community-approved bot performing routine maintenance on citation templates
- Administrator updating MediaWiki configuration after community discussion
- Legitimate template migration or refactoring by trusted editors
level: medium
