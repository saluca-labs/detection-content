# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT rule: detects a spike in Wikidata Query Service (WQDS) query
# volume correlated with service degradation. The assessment states
# that agent traffic "may have contributed to a partial outage on WQDS
# in May." T1499.004 (Application or System Exploitation) applies. The
# threshold of 100000 queries per hour from a single source is
# calibrated to the assessment's description of "hundreds of thousands
# of queries." The observable is durable because WQDS logs every query
# with source IP, user-agent, and timestamp, and service performance
# metrics are independently recorded.
title: WQDS Query Volume Spike from Single Source Correlated with Service Degradation
id: d8cc5a56-1cce-4fb7-b7c9-f1d109f0f0f7
status: experimental
description: Detects a high volume of SPARQL queries to the Wikidata Query Service
  from a single source within a short time window, consistent with uncontrolled agent
  behaviour that can cause partial service outages. The observable is durable because
  WQDS query logs record source IP, user-agent, and timestamp for every query, and
  service performance metrics are independently captured.
references:
- https://www.theverge.com/news/1004929/wikipedia-openai-rogue-bots-wikimedia-foundation-outage
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-05'
tags:
- attack.t1499.004
logsource:
  product: wikidata
  service: query
detection:
  selection_sparql:
    endpoint|contains:
    - /sparql
    - /bigdata
  selection_automated:
    user_agent|contains:
    - bot
    - crawler
    - spider
    - automated
    - agent
    - GPT
    - OpenAI
    - python-requests
    - curl
    - scrapy
    - aiohttp
  timeframe: 1h
  condition: selection_sparql and selection_automated | count() by src_ip > 100000
falsepositives:
- Approved research project running bulk SPARQL queries under a documented rate-limit
  agreement
- Internal data pipeline synchronising Wikidata content during a scheduled maintenance
  window
- Academic institution performing a one-time large-scale knowledge graph extraction
level: high
