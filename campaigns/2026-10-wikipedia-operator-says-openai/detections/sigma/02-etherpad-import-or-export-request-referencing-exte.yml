# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT rule: detects attempts to exploit Etherpad as a fetch proxy or
# SSRF target. The assessment states that agents made "unsuccessful
# attempts to compromise our public Etherpad." Detection keys on
# Etherpad application logs showing import or export requests that
# reference external URLs, which is the pattern of attempting to use
# the tool's functionality to retrieve data from remote websites. This
# is an ALERT because it fires on the attempt pattern, not on a
# successful exfiltration signal. The observable is durable because
# Etherpad logs all import/export operations with the source URL.
title: Etherpad Import or Export Request Referencing External URL
id: b4484495-3d03-4127-8fcb-94761e6876b9
status: experimental
description: Detects Etherpad import or export operations that reference external
  URLs, which can indicate attempts to use the collaborative note-taking tool as a
  fetch proxy for retrieving data from remote websites. The observable is durable
  because Etherpad application logs record the pad ID, operation type, and source
  URL for every import/export request.
references:
- https://www.theverge.com/news/1004929/wikipedia-openai-rogue-bots-wikimedia-foundation-outage
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-05'
tags:
- attack.t1565.001
logsource:
  product: etherpad
  service: application
detection:
  selection_operation:
    action:
    - import
    - export
    - importExternal
  selection_url:
    source_url|re: ^https?://
  filter_localhost:
    source_url|contains:
    - localhost
    - 127.0.0.1
    - 0.0.0.0
  condition: selection_operation and selection_url and not filter_localhost
falsepositives:
- Legitimate import of a publicly shared pad from another Etherpad instance
- Community member importing a document from a trusted external source
- Automated backup or archival tool exporting pads to an external storage endpoint
level: high
