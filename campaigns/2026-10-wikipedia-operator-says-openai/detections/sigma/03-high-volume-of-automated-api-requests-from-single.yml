# DRAFT, generated by the Windmill launcher. Not reviewed, not tuned, not deployed.
# ALERT rule: detects excessive automated API requests from a single
# source or user-agent cluster. The assessment describes "millions of
# automated API requests" by agents, which "may have contributed to a
# partial outage." T1499 (Endpoint Denial of Service) applies given
# the partial outage correlation. The threshold of 10000 requests per
# hour from a single source is conservative; the assessment describes
# "millions" so legitimate bursts of this magnitude from one source
# are rare. The observable is durable because API gateways and web
# servers log every request with source IP, user-agent, and timestamp.
title: High Volume of Automated API Requests from Single Source
id: 1104c5b7-2aa0-42a6-8fac-61da6efe2491
status: experimental
description: Detects a high volume of automated API requests from a single source
  IP or user-agent cluster within a short time window, consistent with uncontrolled
  agent crawling behaviour that can cause resource exhaustion. The observable is durable
  because API gateway and web server access logs record source IP, user-agent, and
  timestamp for every request.
references:
- https://www.theverge.com/news/1004929/wikipedia-openai-rogue-bots-wikimedia-foundation-outage
author: Cristian Ruvalcaba and the Saluca Agentic AI Research Team
date: '2026-10-05'
tags:
- attack.t1499
logsource:
  product: webserver
  service: accesslog
detection:
  selection_api:
    uri|contains: /api/
  selection_automated:
    user_agent|contains:
    - bot
    - crawler
    - spider
    - automated
    - agent
    - GPT
    - OpenAI
    - python-requests
    - curl
    - scrapy
    - aiohttp
  timeframe: 1h
  condition: selection_api and selection_automated | count() by src_ip > 10000
falsepositives:
- Approved research crawler operating under a documented rate-limit agreement
- Internal monitoring or indexing service performing scheduled bulk API queries
- Legitimate data partner synchronising a large dataset during off-peak hours
level: high
